<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Agende online o banho e a tosa do seu pet na Dog Ville.">
  <title>Banho e Tosa - Dog Ville Pet Shop</title>

  <!-- Favicon -->
  <link rel="shortcut icon" href="imagens/favicon2.png" type="image/x-icon">

  <!-- CSS -->
  <link rel="stylesheet" href="normalize.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">

  <!-- icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- HTML5 shim for IE < 9 -->
  <!--[if lt IE 9]>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5shiv/3.7.3/html5shiv.min.js"></script>
  <![endif]-->
</head>
<body>
  <nav class="menu-lateral" aria-label="Menu principal">
    <div class="sidebaar expanded" id="sidebaar">
      <a href="#"></a>
      <img class="logo" src="imagens/dogville.png" alt="Logo Dog ville" width="250">
    </div>
    <div class="btn-expandir">
      <i class="bi bi-list" id="btn-exp" role="button" tabindex="0" aria-label="Expandir menu" aria-expanded="false"></i>
    </div>

    <ul>
      <li class="item-menu">
        <a href="index.html">
          <span class="icon"><i class="bi bi-house"></i></span>
          <span class="txt-link">Home</span>
        </a>
      </li>
      <li class="item-menu">
        <a href="hotel.html">
          <span class="icon"><i class="bi bi-building-fill"></i></span>
          <span class="txt-link">Hotel</span>
        </a>
      </li>
      <li class="item-menu ativo">
        <a href="tosa.html">
          <span class="icon"><i class="bi bi-gitlab"></i></span>
          <span class="txt-link">Banho/Tosa</span>
        </a>
      </li>
      <li class="item-menu">
        <a href="Loja.html">
          <span class="icon"><i class="bi bi-shop"></i></span>
          <span class="txt-link">Loja</span>
        </a>
      </li>
      <li class="item-menu">
        <div class="busca-menu">
          <span class="icon"><i class="bi bi-search"></i></span>
          <span class="txt-link">
            <form class="form-inline" role="search">
              <input type="search" class="form-control" placeholder="Pesquisar" aria-label="Pesquisar">
            </form>
          </span>
        </div>
      </li>
    </ul>
  </nav>

  <main class="main">
    <aside class="sidebar">
      <section class="conteudo container">
        <h1 class="titulo-pagina">Agende o banho e tosa do seu pet</h1>
        <p class="subtitulo-pagina">Escolha o serviço, o dia e um horário livre. É rápido!</p>

        <div class="agendamento-wrap">
          <form id="form-agendamento" class="agendamento-form" novalidate>
            <div class="form-group">
              <label for="service_id">Serviço</label>
              <select id="service_id" name="service_id" class="form-control" required>
                <option value="">Carregando...</option>
              </select>
            </div>

            <div class="form-row">
              <div class="form-group col-md-6">
                <label for="date">Data</label>
                <input type="date" id="date" name="date" class="form-control" required>
              </div>
              <div class="form-group col-md-6">
                <label for="time">Horário</label>
                <select id="time" name="time" class="form-control" required disabled>
                  <option value="">Escolha a data primeiro</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label for="owner_name">Seu nome</label>
              <input type="text" id="owner_name" name="owner_name" class="form-control" maxlength="100" required>
            </div>

            <div class="form-group">
              <label for="phone">Telefone / WhatsApp</label>
              <input type="tel" id="phone" name="phone" class="form-control" placeholder="(71) 99999-9999" required>
            </div>

            <div class="form-row">
              <div class="form-group col-md-7">
                <label for="pet_name">Nome do pet</label>
                <input type="text" id="pet_name" name="pet_name" class="form-control" maxlength="100" required>
              </div>
              <div class="form-group col-md-5">
                <label for="pet_type">Tipo</label>
                <select id="pet_type" name="pet_type" class="form-control" required>
                  <option value="Cachorro">Cachorro</option>
                  <option value="Gato">Gato</option>
                  <option value="Outro">Outro</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label for="notes">Observações (opcional)</label>
              <textarea id="notes" name="notes" class="form-control" rows="2" placeholder="Ex.: porte, alergias, comportamento"></textarea>
            </div>

            <button type="submit" id="btn-agendar" class="btn-verde">Agendar</button>
            <div id="aviso-agendamento" class="aviso" role="status"></div>
          </form>

          <div class="agendamento-foto hide-mobile">
            <img loading="lazy" src="imagens/banho-tosa.png" alt="Banho e tosa Dog Ville" class="img-fluid">
          </div>
        </div>
      </section>
    </aside>
  </main>

  <footer>
    <p>
      A empresa | Suporte ao cliente | Loja física <br>
      Políticas | Termos e condições | Trocas e devoluções | Privacidade | Cookies <br>
      Formas de pagamento | Redes sociais
    </p>
  </footer>

  <!-- Scripts -->
  <script src="menu.js"></script>
  <script src="js/agendamento.js"></script>
  <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy" crossorigin="anonymous"></script>
</body>
</html>
